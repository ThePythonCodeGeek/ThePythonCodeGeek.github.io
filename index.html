<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lovely</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Create your character</h1>
        
        <div class="form-group">
            <label for="name">Name:</label>
            <input type="text" id="name" placeholder="Enter character name">
        </div>

        <div class="form-group">
            <label>Gender:</label>
            <div class="option-group">
                <button class="option-btn" data-type="gender" data-value="male">Male</button>
                <button class="option-btn" data-type="gender" data-value="female">Female</button>
                <button class="option-btn" data-type="gender" data-value="non-binary">Non-Binary</button>
                <button class="option-btn" data-type="gender" data-value="other">Other</button>
            </div>
        </div>

        <div class="form-group">
            <label>Sexuality:</label>
            <div class="option-group">
                <button class="option-btn" data-type="sexuality" data-value="gay">Gay</button>
                <button class="option-btn" data-type="sexuality" data-value="lonely">Aromantic</button>
                <button class="option-btn" data-type="sexuality" data-value="straight">Straight</button>
                <button class="option-btn" data-type="sexuality" data-value="bi-sexual">Bi Sexual</button>
                <button class="option-btn" data-type="sexuality" data-value="pan-sexual">Pan sexual</button>
            </div>
        </div>

        <div class="form-group">
            <label for="background">Background:</label>
            <select id="background">
                <option value="">Select a background...</option>
                <option value="warrior">Warrior</option>
                <option value="mage">Mage</option>
                <option value="rogue">Rogue</option>
                <option value="paladin">Paladin</option>
                <option value="ranger">Ranger</option>
            </select>
        </div>

        <button id="save-btn" class="save-btn">Save Character</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
